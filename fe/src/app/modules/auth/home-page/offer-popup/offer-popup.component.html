<div class="fixed inset-0 z-[999] flex items-center justify-center bg-black/50 p-4" (click)="onClose()">
    <div class="relative w-full max-w-4xl max-h-[90vh] overflow-y-auto bg-white shadow-xl animate-fadeIn" (click)="onContentClick($event)">
        <button class="absolute top-4 right-4 z-10 p-2 text-white bg-black/20 hover:bg-black/40 rounded-full transition-colors" (click)="onClose()">
            <mat-icon class="text-white text-[12px]">close</mat-icon>
        </button>

        <div class="w-full h-[400px] relative">
            <img [src]="baseUrl + image" class="w-full h-full object-cover" alt="Offer Image">
        </div>

        <div class="p-8 md:p-12 text-center">
            <h2 class="mb-6 text-3xl font-clearface text-black">{{ offer?.title }}</h2>
            
            <div class="font-avenir text-lg text-gray-700 space-y-4 max-w-2xl mx-auto">
                <p *ngIf="offer?.description">{{ offer.description }}</p>
                
                 <div *ngIf="!offer?.description && offer?.content" [innerHTML]="offer.content"></div>
            </div>

            <div *ngIf="offer?.code" class="mt-8 pt-6 border-t border-gray-100">
                <span class="text-sm font-lexend_deca text-gray-500 uppercase tracking-wider">Offer Code</span>
                <p class="text-xl font-bold font-lexend_deca text-black mt-1 mb-4">{{ offer.code }}</p>
                <a [href]="'explore-hotels?code='+offer?.code" class="mt-4 py-2 px-3 bg-yellow-500 text-black font-lexend_deca">
                    {{'offer.explore_hotels'|transloco}}
                </a>
            </div>
            
             <p *ngIf="!offer?.description && !offer?.content" class="text-gray-500 italic mt-4"> {{'offer.no_description'|transloco}}</p>
             
        </div>
    </div>
</div>
