<div class="relative w-full max-w-3xl mt-4 sm:mt-6 px-2 sm:px-0">
  
  <!-- Line background -->
  <div class="absolute top-[30%] left-2 sm:left-0 right-2 sm:right-0 w-[calc(100%-1rem)] sm:w-full h-0.5 sm:h-1 bg-gray-200 -translate-y-1/2 rounded-full"></div>

  <!-- Animated progress line -->
  <div
    class="absolute top-[30%] left-2 sm:left-0 h-0.5 sm:h-1 z-[2] bg-amber-700 rounded-full transition-all duration-700 ease-in-out"
    [style.width.%]="progressWidth"
    [style.max-width]="'calc(' + progressWidth + '% - 1rem)'"
    [class.sm:max-w-none]="true">
  </div>

  <!-- Steps -->
  <div class="relative flex justify-between items-center z-[9] px-2 sm:px-0">
    <div
      *ngFor="let step of steps; let i = index"
      class="flex flex-col items-center w-1/3"
    >
      <div (click)="onStepClick(i)"
        class="flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 font-bold text-[12px] sm:text-[14px] transition-all duration-500 border-2 rounded-full cursor-pointer hover:scale-105 active:scale-95 min-h-[44px] min-w-[44px] sm:min-h-0 sm:min-w-0"
        [ngClass]="{
          'bg-amber-700 border-amber-700 !text-white scale-110 shadow-md': i === stepIndex,
          'bg-amber-500 border-amber-500 text-white': i < stepIndex,
          'bg-white border-gray-300 text-gray-400': i > stepIndex
        }"
      >
        {{ i + 1 }}
      </div>
      <span  class="mt-1.5 sm:mt-2 text-[9px] sm:text-[10px] font-avenir font-extrabold text-center px-1 break-words"
      [ngClass]="{
          '  text-amber-700 scale-110': i === stepIndex,
          '  text-amber-700': i < stepIndex,
          '  text-gray-400': i > stepIndex
        }">{{ step }}</span>
    </div>
  </div>
</div>
