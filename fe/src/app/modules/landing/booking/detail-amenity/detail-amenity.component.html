<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 p-2 sm:p-4 animate-fade-in">
    <div class="relative w-full max-w-3xl bg-[#f4f4f4] shadow-2xl overflow-hidden flex flex-col max-h-[95vh] sm:max-h-[90vh] animate-scale-in rounded-lg sm:rounded-none">
        <!-- Header / Close Button -->
        <button (click)="closePopupFunc()" class="absolute top-2 right-2 sm:top-4 sm:right-4 p-2 hover:bg-black/10 rounded-full transition-colors z-10 outline-none min-h-[44px] min-w-[44px] flex items-center justify-center">
            <mat-icon class="text-black text-[20px] sm:text-[24px]">close</mat-icon>
        </button>

        <!-- Content -->
        <div class="p-4 sm:p-6 md:p-8 lg:p-12 overflow-y-auto custom-scrollbar">
            <h2 class="font-clearface text-[24px] sm:text-[28px] md:text-[32px] lg:text-[40px] text-black mb-4 sm:mb-6 pr-8 sm:pr-10 leading-tight">{{roomtype?.name}}</h2>
            
            <p class="font-avenir text-[14px] sm:text-[16px] md:text-[18px] leading-relaxed mb-6 sm:mb-8 lg:mb-10 text-gray-800 text-justify">
                {{roomtype?.description}}
            </p>

            <div class="w-full">
                <h3 class="font-clearface text-[20px] sm:text-[22px] md:text-[24px] mb-4 sm:mb-6 border-b border-black/10 pb-2">Amenities</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 sm:gap-x-6 md:gap-x-8 gap-y-3 sm:gap-y-4">
                    <div *ngFor="let amenity of roomtype?.amenity" class="flex items-start gap-2 sm:gap-3 group">
                        <mat-icon class="text-black text-[10px] sm:text-[12px] mt-[4px] sm:mt-[6px] opacity-70 group-hover:opacity-100 transition-opacity flex-shrink-0">circle</mat-icon> 
                        <span class="text-[14px] sm:text-[16px] font-avenir text-black group-hover:translate-x-1 transition-transform break-words">{{amenity?.amenityName}}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
