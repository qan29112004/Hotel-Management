<div class="flex w-full h-screen">
    <div class="relative flex items-center justify-center w-full h-full bg-center bg-no-repeat bg-cover"
        [style.background-image]="'url('+ ('assets/images/booking/booking_success.jpg')+ ')'"
    >
        <div class="absolute z-0 w-full h-full bg-black/50"></div>
        <div class="flex flex-col items-center justify-start w-[50%] h-auto gap-4 p-5 bg-white rounded-md z-[1]">
            <!-- Success State -->
            <ng-container *ngIf="status === 'success'">
                <div class="block">
                    <span class="text-green-500 text-[25px] font-clearface uppercase font-semibold">Thanh toán thành công</span>
                </div>
                <div class="block">
                    <img src="assets/images/booking/green_tick.gif" class="w-40 h-40"/>
                </div>
                <div class="flex items-center justify-between w-full" *ngIf="transactionId">
                    <span class="font-clearface text-[20px] text-black tracking-wider">Mã giao dịch:</span>
                    <span class="font-avenir text-[16px]">03654872</span>
                </div>
                <div class="flex items-center justify-between w-full" *ngIf="amount">
                    <span class="font-clearface text-[20px] text-black tracking-wider">Số tiền:</span>
                    <span class="font-avenir text-[16px]">301000đ</span>
                </div>
                <div class="flex items-center justify-between w-full" *ngIf="hotelName">
                    <span class="font-clearface text-[20px] text-black tracking-wider">Khách sạn:</span>
                    <span class="font-avenir text-[16px]">Đà Nẵng Hotel</span>
                </div>
                <div class="grid grid-cols-2 gap-4 w-full mt-4">
                    <button type="button" (click)="goHome()" class="px-6 py-3 text-white bg-black font-clearface text-[17px] hover:bg-gray-800 transition-colors">Trang chủ</button>
                    <button type="button" (click)="viewBooking()" class="px-6 py-3 text-white bg-black font-clearface text-[17px] hover:bg-gray-800 transition-colors">Xem booking</button>
                </div>
            </ng-container>

            <!-- Failed State -->
            <ng-container *ngIf="status === 'failed'">
                <div class="block">
                    <span class="text-red-500 text-[25px] font-clearface uppercase font-semibold">Thanh toán thất bại</span>
                </div>
                <div class="block">
                    <svg class="w-40 h-40 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <div class="flex flex-col gap-2 w-full" *ngIf="errorMessage">
                    <span class="font-clearface text-[18px] text-black tracking-wider">Lỗi:</span>
                    <span class="font-avenir text-[16px] text-red-600">{{errorMessage}}</span>
                </div>
                <div class="flex items-center justify-between w-full" *ngIf="errorCode">
                    <span class="font-clearface text-[20px] text-black tracking-wider">Mã lỗi:</span>
                    <span class="font-avenir text-[16px]">{{errorCode}}</span>
                </div>
                <div class="flex items-center justify-between w-full" *ngIf="bookingId">
                    <span class="font-clearface text-[20px] text-black tracking-wider">Mã booking:</span>
                    <span class="font-avenir text-[16px]">{{bookingId}}</span>
                </div>
                <div class="grid grid-cols-2 gap-4 w-full mt-4">
                    <button type="button" (click)="goHome()" class="px-6 py-3 text-white bg-gray-500 font-clearface text-[17px] hover:bg-gray-600 transition-colors">Trang chủ</button>
                    <button type="button" (click)="retryPayment()" class="px-6 py-3 text-white bg-red-500 font-clearface text-[17px] hover:bg-red-600 transition-colors">Thanh toán lại</button>
                </div>
            </ng-container>

            <!-- Loading/Unknown State -->
            <ng-container *ngIf="!status">
                <div class="block">
                    <span class="text-gray-500 text-[25px] font-clearface uppercase font-semibold">Đang xử lý...</span>
                </div>
            </ng-container>
        </div>
    </div>
</div>
